name: Publish a build

# ビルドの成果物を、リリース（試用版）に載せる。
#   Windows: windows.yml の実行番号（run_id）→ ZIP とインストーラー
#   Linux:   build.yml の実行番号（linux_run_id）→ タグの版の tar.gz と .sha256
# 使い方: Actions の「Publish a build」から、実行番号（片方だけでも可）とタグ名（例 v10.0.6-ja.3）を入れて実行する。
#   gh workflow run publish.yml -f tag=v8.0.9-ja.3 -f run_id=<windows> -f linux_run_id=<build>
# タグの版（v8.0.9-ja.3 なら 8.0.9）と違う版のファイルは載せない。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "windows.yml の実行番号（run id）。空なら Windows 版は載せない"
        required: false
        default: ""
      linux_run_id:
        description: "build.yml の実行番号（run id）。空なら Linux 版は載せない"
        required: false
        default: ""
      tag:
        description: "リリースのタグ（例 v10.0.6-ja.1）"
        required: true
      title:
        description: "リリースの題名（空ならタグ名）"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the Windows build
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out/windows
      - name: Get the Linux build
        if: inputs.linux_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ver=${TAG#v}; ver=${ver%%-*}
          name=kicad-ja-plus-$ver-linux-x86_64
          gh run download "${{ inputs.linux_run_id }}" -R "$GITHUB_REPOSITORY" -n "$name" -D out/linux
          (cd out/linux && sha256sum -c "$name.tar.gz.sha256")
      - name: Create the release and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ -n "${{ inputs.run_id }}${{ inputs.linux_run_id }}" ] || { echo "実行番号が 1 つも無い"; exit 1; }
          mkdir -p out && ls -laR out
          title="${{ inputs.title }}"
          [ -n "$title" ] || title="$TAG"
          ver=${TAG#v}; ver=${ver%%-*}
          win="Windows 版（署名なし）: インストーラーで入れるか、ZIP を展開して bin\\kicad.exe を起動する。SmartScreen が出たら「詳細情報」→「実行」。"
          lin="Linux 版（Ubuntu 24.04 x86_64）: kicad-ja-plus-$ver-linux-x86_64.tar.gz。本家の KiCad（PPA の同じ系列）を入れてから展開し、bin/ を PATH に入れる（README の「入れ方（Linux）」）。"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --target "${{ github.sha }}" --prerelease --title "$title" \
              --notes "$([ -n "${{ inputs.run_id }}" ] && echo "$win")
          $([ -n "${{ inputs.linux_run_id }}" ] && echo "$lin")"
          files=()
          # Windows 版にも Linux 版と同じく .sha256 を付ける
          while IFS= read -r -d '' f; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")" > "$(basename "$f").sha256"); done < <(find out/windows -type f \( -name '*.exe' -o -name '*.zip' \) -print0 2>/dev/null)
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find out/windows -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.exe.sha256' -o -name '*.zip.sha256' \) -print0 2>/dev/null)
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find out/linux -type f \( -name "kicad-ja-plus-$ver-linux-x86_64.tar.gz" -o -name "kicad-ja-plus-$ver-linux-x86_64.tar.gz.sha256" \) -print0 2>/dev/null)
          [ ${#files[@]} -gt 0 ] || { echo "載せるファイルが無い"; exit 1; }
          printf '載せる: %s\n' "${files[@]}"
          gh release upload "$TAG" --clobber "${files[@]}"
          # 既にあったリリースに Linux 版を足したときは、説明にも足す
          if [ -n "${{ inputs.linux_run_id }}" ]; then
            body=$(gh release view "$TAG" --json body --jq .body)
            case "$body" in
              *"Linux 版"*) ;;
              *) gh release edit "$TAG" --notes "$body
          $lin" ;;
            esac
          fi
