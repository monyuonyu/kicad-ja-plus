name: Publish a Windows build

# Windows のビルド（windows.yml）の成果物を、リリース（試用版）に載せる。
# 使い方: Actions の「Publish a Windows build」から、ビルドの実行番号（run id）とタグ名（例 v10.0.6-ja.1）を入れて実行する。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "windows.yml の実行番号（run id）"
        required: true
      tag:
        description: "リリースのタグ（例 v10.0.6-ja.1）"
        required: true
      title:
        description: "リリースの題名（空ならタグ名）"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - name: Create the release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -laR out
          title="${{ inputs.title }}"
          [ -n "$title" ] || title="${{ inputs.tag }}"
          gh release view "${{ inputs.tag }}" > /dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --target "${{ github.sha }}" --prerelease --title "$title" \
              --notes "Windows 版（署名なし）。インストーラーで入れるか、ZIP を展開して bin\\kicad.exe を起動する。SmartScreen が出たら「詳細情報」→「実行」。作った手順: Actions の windows.yml（実行 ${{ inputs.run_id }}）。"
          find out -type f \( -name '*.exe' -o -name '*.zip' \) -print0 | xargs -0 gh release upload "${{ inputs.tag }}" --clobber
