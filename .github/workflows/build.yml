# KiCad に改良を当ててビルドし、回帰試験を流す（Linux、版ごと）
name: Build and test
on:
  # 非公開の間は自動ビルドの時間に上限があるので、手で走らせる（gh workflow run build.yml）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "10.0.6"
            ppa: kicad-10.0-releases
            deps: patches/10.0.6/builddeps.txt
            # 10.0.6 の kicad_route・kicad_gerber は画面なしで動く
            runner: ""
          - version: "8.0.9"
            ppa: kicad-8.0-releases
            deps: patches/8.0.9/notes/builddeps.txt
            # 8.0.9 の kicad_route・kicad_gerber は起動時に GTK を要るので、仮想の画面で
            runner: "xvfb-run -a"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # 部品ライブラリと、比べるための kicad-cli はシステムの KiCad（同じ系列を PPA から）
          sudo add-apt-repository -y ppa:kicad/${{ matrix.ppa }}
          sudo apt-get update
          sudo apt-get install -y $(cat ${{ matrix.deps }}) kicad ccache \
            python3-numpy python3-matplotlib python3-pil fonts-ipaexfont-gothic xvfb

      - name: Prepare the KiCad settings
        run: |
          # KiCad を初めて起動したときと同じく、グローバルのライブラリ表を置く（kicad-cli は自分では作らない）
          v=$(echo "${{ matrix.version }}" | cut -d. -f1).0
          mkdir -p "$HOME/.config/kicad/$v"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/$v/" || true

      - name: Get KiCad and apply the patches
        run: ./apply.sh ${{ matrix.version }} "$HOME/src/kicad-${{ matrix.version }}"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.version }}-${{ hashFiles(format('patches/{0}/**', matrix.version)) }}
          restore-keys: ccache-${{ matrix.version }}-

      - name: Configure
        run: |
          cmake -S "$HOME/src/kicad-${{ matrix.version }}" -B "$HOME/src/build-${{ matrix.version }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKICAD_BUILD_PNS_DEBUG_TOOL=ON -DKICAD_SCRIPTING_WXPYTHON=OFF -DKICAD_BUILD_I18N=OFF

      - name: Build
        run: |
          ninja -C "$HOME/src/build-${{ matrix.version }}" -j4 kicad-cli pcbnew_kiface eeschema_kiface cvpcb_kiface \
            kicad_route kicad_gerber pcbnew/_pcbnew.so s3d_plugin_vrml s3d_plugin_oce s3d_plugin_idf

      - name: Regression test
        run: |
          export PATH="$PWD/bin:$PATH" KICAD_LOCAL_BUILD="$HOME/src/build-${{ matrix.version }}"
          ${{ matrix.runner }} test/regress.sh

      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-now-${{ matrix.version }}
          path: test/now/
          if-no-files-found: ignore
