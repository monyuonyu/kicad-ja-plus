# KiCad に改良を当ててビルドし、回帰試験を流す（Linux、版ごと）
name: Build and test
on:
  # 非公開の間は自動ビルドの時間に上限があるので、手で走らせる（gh workflow run build.yml）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "10.0.6"
            ppa: kicad-10.0-releases
            deps: patches/10.0.6/builddeps.txt
            # 10.0.6 の kicad_route・kicad_gerber は画面なしで動く
            runner: ""
            # 10.0.6 だけにある物（IPC API の型の説明。build/schemas があるとビルドの場所だと分かる）
            extra_targets: "api_schema_build_copy remote_provider_schema_build_copy"
          - version: "8.0.9"
            ppa: kicad-8.0-releases
            deps: patches/8.0.9/notes/builddeps.txt
            # 8.0.9 の kicad_route・kicad_gerber は起動時に GTK を要るので、仮想の画面で
            runner: "xvfb-run -a"
            extra_targets: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # 部品ライブラリと、比べるための kicad-cli はシステムの KiCad（同じ系列を PPA から）
          sudo add-apt-repository -y ppa:kicad/${{ matrix.ppa }}
          sudo apt-get update
          sudo apt-get install -y $(cat ${{ matrix.deps }}) kicad ccache \
            python3-numpy python3-matplotlib python3-pil fonts-ipaexfont-gothic xvfb patchelf \
            imagemagick x11-utils locales
          # 画面の確かめを日本語で
          sudo locale-gen ja_JP.UTF-8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Get Freerouting (for kicad-local autoroute)
        run: |
          mkdir -p "$HOME/.local/share/kicad-ja-plus"
          curl -fsSL -o "$HOME/.local/share/kicad-ja-plus/freerouting.jar" \
            https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1.jar
          echo "251101c3eeac22d7e7dfcf6796603279e5d1000283eb82d8f093780f7afc6aa9  $HOME/.local/share/kicad-ja-plus/freerouting.jar" | sha256sum -c

      - name: Prepare the KiCad settings
        run: |
          # KiCad を初めて起動したときと同じく、グローバルのライブラリ表を置く（kicad-cli は自分では作らない）
          v=$(echo "${{ matrix.version }}" | cut -d. -f1).0
          mkdir -p "$HOME/.config/kicad/$v"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/$v/" || true

      - name: Get KiCad and apply the patches
        run: ./apply.sh ${{ matrix.version }} "$HOME/src/kicad-${{ matrix.version }}"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.version }}-${{ hashFiles(format('patches/{0}/**', matrix.version)) }}
          restore-keys: ccache-${{ matrix.version }}-

      - name: Configure
        run: |
          cmake -S "$HOME/src/kicad-${{ matrix.version }}" -B "$HOME/src/build-${{ matrix.version }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKICAD_BUILD_PNS_DEBUG_TOOL=ON -DKICAD_SCRIPTING_WXPYTHON=OFF -DKICAD_BUILD_I18N=ON
          # インストールはしない。CMAKE_INSTALL_PREFIX=/usr は、部品ライブラリ・テンプレートの既定の場所を
          # 本家の KiCad（PPA）と同じ /usr/share/kicad にするため

      - name: Build
        id: build
        run: |
          # 画面なしの道具と、配布物に入れる画面（kicad・pcbnew・eeschema ほか）・アイコン・翻訳・AI チャットの仲介役
          ninja -C "$HOME/src/build-${{ matrix.version }}" -j4 kicad-cli pcbnew_kiface eeschema_kiface cvpcb_kiface \
            kicad_route kicad_gerber pcbnew/_pcbnew.so s3d_plugin_vrml s3d_plugin_oce s3d_plugin_idf \
            kicad pcbnew eeschema gerbview gerbview_kiface pl_editor pl_editor_kiface pcb_calculator pcb_calculator_kiface \
            bitmap2component resources/images.tar.gz i18n kicad_ai_build_copy ${{ matrix.extra_targets }}

      - name: Regression test
        run: |
          export PATH="$PWD/bin:$PATH" KICAD_LOCAL_BUILD="$HOME/src/build-${{ matrix.version }}"
          ${{ matrix.runner }} test/regress.sh

      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-now-${{ matrix.version }}
          path: test/now/
          if-no-files-found: ignore

      # 回帰試験が落ちても、配布物は作って確かめる（どちらも落ちれば、この回は失敗として残る）
      - name: Package (tar.gz)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: package/linux.sh "$HOME/src/build-${{ matrix.version }}" dist ${{ matrix.version }}

      - name: Test the package (extracted, with the build hidden)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # 展開した物だけで動くか（ビルドの場所を隠して、中身の確かめと回帰試験をもう一度）
          mkdir -p /tmp/pkg && tar -C /tmp/pkg -xzf dist/kicad-ja-plus-${{ matrix.version }}-linux-x86_64.tar.gz
          (cd dist && sha256sum -c kicad-ja-plus-${{ matrix.version }}-linux-x86_64.tar.gz.sha256)
          mv "$HOME/src/build-${{ matrix.version }}" "$HOME/src/build.hidden"
          rc=0
          pkg=/tmp/pkg/kicad-ja-plus-${{ matrix.version }}-linux-x86_64
          env -u KICAD_LOCAL_BUILD "$pkg/package/check-linux.sh" "$pkg" "$PWD/shots" || rc=1
          (cd "$pkg" && env -u KICAD_LOCAL_BUILD ${{ matrix.runner }} test/regress.sh) || rc=1
          mv "$HOME/src/build.hidden" "$HOME/src/build-${{ matrix.version }}"
          cat "$pkg/BUILD_INFO.txt"
          exit $rc

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.version }}
          path: shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: kicad-ja-plus-${{ matrix.version }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          compression-level: 0
