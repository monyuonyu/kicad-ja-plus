# Windows 版: MSYS2 (UCRT64) で KiCad をビルドし、ZIP と NSIS のインストーラーを作る
name: Windows build
on:
  workflow_dispatch:
    inputs:
      kicad_version:
        description: "KiCad の版（タグ）"
        default: "10.0.6"
      apply_local:
        description: "このリポジトリの改良を当てる"
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}
    env:
      KV: ${{ inputs.kicad_version }}
      # MSYS2 の KiCad のパッケージ（Windows 向けの手直し）を固定した版から取る
      MSYS2_PKGS_REF: master
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git patch zip
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-swig
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw mingw-w64-ucrt-x86_64-abseil-cpp
            mingw-w64-ucrt-x86_64-cairo mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-freeglut
            mingw-w64-ucrt-x86_64-glew mingw-w64-ucrt-x86_64-glm mingw-w64-ucrt-x86_64-nng
            mingw-w64-ucrt-x86_64-protobuf mingw-w64-ucrt-x86_64-libgit2 mingw-w64-ucrt-x86_64-ngspice
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-opencascade mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-kicad-symbols mingw-w64-ucrt-x86_64-kicad-footprints

      - name: Get KiCad and apply the patches
        run: |
          git clone -q --depth 1 --branch "$KV" https://github.com/KiCad/kicad-source-mirror kicad
          cd kicad
          # このリポジトリの改良を先に（git apply はずれを許さないので、手を入れていない版に当てる）
          if [ "${{ inputs.apply_local }}" = "true" ]; then
            for p in ../patches/$KV/[0-9]*.patch; do
              git apply --whitespace=nowarn "$p" || { echo "当たらない: $p"; exit 1; }
            done
          fi
          # MSYS2 の Windows 向けの手直し（MINGW-packages の mingw-w64-kicad より。patch はずれを許して当てる）
          base="https://raw.githubusercontent.com/msys2/MINGW-packages/$MSYS2_PKGS_REF/mingw-w64-kicad"
          for p in 002-ki-6.0-cmake-fixes-for-MINGW-CLANG.patch 003-ki-6.0-code-fixes-for-GNUC-CLANG.patch \
                   004-fix-loading-ngspice-dll.patch 006-ki-6.0-rewrite-kiwin32_rc_for_clang.patch \
                   007-llvm-libcxx-19.patch 009-clang-needs-explicit-json-implementations.patch; do
            curl -fsSL "$base/$p" -o "../$p"
            patch -Np1 -i "../$p" || { echo "当たらない: $p"; exit 1; }
          done

      # ccache は失敗した回でも保存する（保存しないと、毎回 3 時間かけて全部を作り直す）
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-win-${{ inputs.kicad_version }}-${{ github.run_id }}
          restore-keys: ccache-win-${{ inputs.kicad_version }}-

      # インストール先は 1 つの Windows の場所（D:/a/.../stage の形）に決める。cmake（Windows のプログラム）は
      # /stage を D:\stage と読み、bash は MSYS2 の中の /stage と読むので、/stage と書くと別々の場所になる
      - name: Decide the install location
        run: echo "STAGE=$(cygpath -m "$GITHUB_WORKSPACE/stage")" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          MSYS2_ARG_CONV_EXCL="-DCMAKE_PREFIX_PATH=" \
          cmake -Wno-dev -G Ninja -S kicad -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="$STAGE" \
            -DCMAKE_PREFIX_PATH="$MINGW_PREFIX" \
            -DDEFAULT_INSTALL_PATH="$STAGE" \
            -DwxWidgets_CONFIG_EXECUTABLE="$MINGW_PREFIX/bin/wx-config-3.2" \
            -DOCC_INCLUDE_DIR="$MINGW_PREFIX/include/opencascade" \
            -DKICAD_SCRIPTING_WXPYTHON=OFF -DKICAD_BUILD_I18N=OFF -DKICAD_BUILD_QA_TESTS=OFF \
            -DPYTHON_EXECUTABLE="$MINGW_PREFIX/bin/python.exe" \
            -DPYTHON_ROOT_DIR="$MINGW_PREFIX" -DNGSPICE_ROOT_DIR="$MINGW_PREFIX"

      - name: Build
        run: |
          ccache -z
          # エラーが出ても最後まで続けて、Windows だけで起きるエラーを 1 回で洗い出す
          cmake --build build -j 4 -- -k 0
          ccache -s

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ccache-win-${{ inputs.kicad_version }}-${{ github.run_id }}

      - name: Install and collect the DLLs
        timeout-minutes: 30
        run: |
          cmake --install build
          # 実行に要る DLL（MSYS2 のもの）を bin に集める。ldd は固まることがある（4 時間止まった）ので、
          # objdump で各ファイルが読む DLL の名前を取り、$MINGW_PREFIX/bin にあるものを写す。写したものも同じように調べる
          # 探す元は bin と lib の下の実行ファイル・DLL・kiface・pyd（3D の読み込みなどの置き場所は版で変わるので、決め打ちしない）
          queue=$(find $STAGE/bin $STAGE/lib -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.kiface' -o -iname '*.pyd' \) 2>/dev/null || true)
          echo "調べる元: $(echo $queue | wc -w) 個"
          declare -A seen
          while [ -n "$queue" ]; do
            next=""
            for f in $queue; do
              for d in $(timeout 30 objdump -p "$f" 2>/dev/null | awk '/DLL Name:/ {print $3}'); do
                key=${d,,}
                [ -n "${seen[$key]}" ] && continue
                seen[$key]=1
                src="$MINGW_PREFIX/bin/$d"
                if [ -f "$src" ] && [ ! -f "$STAGE/bin/$d" ]; then
                  cp "$src" "$STAGE/bin/"
                  next="$next $STAGE/bin/$d"
                fi
              done
            done
            queue=$next
          done
          echo "集めた DLL: $(ls $STAGE/bin/*.dll | wc -l) 個"
          # Python（pcbnew のスクリプトと kicad-cli の一部が使う）
          pyver=$(python -c 'import sys;print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
          mkdir -p $STAGE/lib && cp -r "$MINGW_PREFIX/lib/python$pyver" $STAGE/lib/ && rm -rf $STAGE/lib/python$pyver/test
          # 部品ライブラリ（シンボルとフットプリント。3D モデルは大きいので入れない）
          mkdir -p $STAGE/share/kicad
          cp -r "$MINGW_PREFIX/share/kicad/symbols" "$MINGW_PREFIX/share/kicad/footprints" $STAGE/share/kicad/ 2>/dev/null || true
          du -sh "$STAGE"

      # 基板エディタの AI チャット用の Python を同梱する（インストールしてすぐ、ダウンロードなしで使える）。
      # python.org の埋め込み用の Python に、requirements.txt の物（版は固定）を入れる。置き場は <KiCad>/ai-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Bundle the AI chat runtime
        shell: pwsh
        run: |
          $ver = "3.14.7"
          $rt = "$env:STAGE/ai-runtime"
          $have = python -c "import sys;print('%d.%d' % sys.version_info[:2])"
          if ($have -ne "3.14") { throw "pip を走らせる Python の版が違う: $have" }
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile embed.zip
          Expand-Archive embed.zip -DestinationPath $rt
          python -m pip install --disable-pip-version-check --no-compile --only-binary=:all: `
            --target "$rt/Lib/site-packages" -r kicad/scripting/kicad_ai/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install に失敗" }
          # 埋め込み用の Python は ._pth に書いた場所しか見ないので、site-packages を足す
          $pth = Get-ChildItem "$rt/python*._pth" | Select-Object -First 1
          Add-Content $pth.FullName "Lib\site-packages"
          & "$rt/python.exe" -c "import claude_agent_sdk, kipy, keyring; print('AI 用の Python:', claude_agent_sdk.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "同梱した Python で SDK を読み込めない" }
          "{0:N0} MB" -f ((Get-ChildItem $rt -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke test (AI chat bridge, offline parts only)
        shell: pwsh
        run: |
          # 同梱の Python だけで仲介役が起動し、キーが無ければ「need_key」を返すこと（AI には接続しない）
          $rt = "$env:STAGE/ai-runtime"
          $bridge = "$env:STAGE/share/kicad/scripting/kicad_ai/bridge.py"
          $env:PYTHON_KEYRING_BACKEND = "keyring.backends.fail.Keyring"
          $out = "" | & "$rt/python.exe" $bridge --datadir "$env:RUNNER_TEMP/ai-data"
          Write-Output $out
          if (-not ($out -match '"need_key"')) { throw "仲介役が起動しない" }
          # SDK に入っている claude が動くこと
          $claude = Get-ChildItem "$rt/Lib/site-packages/claude_agent_sdk/_bundled/claude*.exe" | Select-Object -First 1
          & $claude.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "同梱の claude が動かない" }

      - name: Smoke test
        run: |
          cd kicad/demos/pic_programmer
          $STAGE/bin/kicad-cli.exe version
          # 基板エディタの AI チャットの仲介役が入っていること
          for f in bridge.py run_code.py setup_ai.py requirements.txt; do
            test -f "$STAGE/share/kicad/scripting/kicad_ai/$f" || { echo "AI チャットのファイルが無い: $f"; exit 1; }
          done
          $STAGE/bin/kicad-cli.exe pcb drc -o "$GITHUB_WORKSPACE/drc.rpt" pic_programmer.kicad_pcb || true
          test -s "$GITHUB_WORKSPACE/drc.rpt" && head -5 "$GITHUB_WORKSPACE/drc.rpt"
          $STAGE/bin/kicad-cli.exe pcb export stats -o "$GITHUB_WORKSPACE/stats.txt" pic_programmer.kicad_pcb
          head -20 "$GITHUB_WORKSPACE/stats.txt"

      - name: Package (ZIP and installer)
        run: |
          name="kicad-ja-plus-${KV}-windows-x86_64"
          mkdir -p out
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" .)
          makensis -DVERSION="$KV" -DSTAGE="$(cygpath -w "$STAGE")" -DOUTFILE="$(cygpath -w "$GITHUB_WORKSPACE/out/$name-installer.exe")" installer/kicad-ja-plus.nsi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: kicad-ja-plus-${{ inputs.kicad_version }}-windows
          path: out/
