# kbom: 品番の中のリードの間隔の符号(kicad-local bom check)
# メーカーの資料で確かめたものだけを書く。pattern の最初の ( ) が符号、codes が 符号 → 間隔 [mm]。
# 表に無い符号は判定しない(推測しない)。

[[pitch]]
name = "村田 RDE(リード付き積層セラミック)"
pattern = '^RDE[A-Z0-9]{9}([A-Z][0-9])'      # RDE R7 1H 104 K 0 [P1] H03 B: 12 文字目からの 2 文字がリードの形
codes = { P1 = 2.5, K1 = 5.0 }
src = "村田製作所 RDE シリーズの品番の構成(リード形状 P1: 間隔 2.5mm、K1: 5.0mm)。販売店の品番ごとの仕様でも確認(2026-10-29)"

[[pitch]]
name = "TDK FG(リード付き積層セラミック)"
pattern = '^FG([12])[0-9]'                    # FG [2] 8 C0G ...: FG の次の 1 桁がリードの間隔
codes = { "1" = 2.5, "2" = 5.0 }
src = "TDK FG シリーズのカタログ(品番の構成: 1 = 2.5mm、2 = 5.0mm。FG18 / FG28 の例)。販売店の品番ごとの仕様でも確認(2026-10-29)"
