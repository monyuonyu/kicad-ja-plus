# ksim 部品の定格(定格チェック `[stress]` 用)
# 値(value)か MPN の一部で引く。src に出典を書く(確かめていない値は入れない)。
#
# 項目: p = 定常の損失 [W]、ppk = パルスの尖頭電力 [W](10/1000µs)、v = 最高使用電圧 [V]、
#       v_pulse = 短時間の過負荷電圧 [V]、vceo / vebo / ic / ib(トランジスタ)、vds / vgs / id(MOSFET)、
#       i = 電流 [A](ヒューズ・PTC は保持電流)
# 抵抗・コンデンサは、MPN や値の「1/4W」「/50V」からも自動で読む(下の表はそれより優先)。

[rating."2SC1815"]
vceo = 50
vebo = 5
ic = 0.15
ib = 0.05
p = 0.4
src = "東芝 2SC1815 データシート"

[rating."1N5231B"]
p = 0.5
src = "1N52xxB シリーズ: 500mW(DO-35)"

# 書き方の例(自分の部品はデータシートで確かめてから足す):
# [rating."PTC-例"]            i = 0.05   v = 60           # 保持電流と最高電圧
# [rating."FUSE-2A-例"]        i = 2.0    derate = 0.75
# [capacitor."電解の系列名"]    tand = 0.12                  # ESR = tanδ / (2π·120Hz·C)
# [resistor."1/4W の系列名"]    p = 0.25   v = 200   v_pulse = 400

# 部品ごとに derate = 0.75 のように書くと、その部品だけ余裕の目安を変える
# 余裕の目安(使用値 / 定格 がこれ以下なら OK、100% 以下なら「注意」、超えたら NG)
[derating]
power = 0.5        # 抵抗・半導体の損失
voltage = 0.8      # 電圧(抵抗・コンデンサ・半導体)
current = 0.8      # 電流(トランジスタ・MOSFET・ヒューズ)
pulse = 0.8        # TVS のパルス尖頭電力、抵抗の過負荷電圧
