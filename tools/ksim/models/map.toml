# ksim の既定の対応表: 部品の値(または MPN 欄) → モデル
# spec の [models] map に同じキーを書くと、そちらが優先される
#   モデル名        : models/*.lib の .model 名
#   "R:値"          : 抵抗で近似(ヒューズ・PTC など)。"R:値±幅%" でばらつきの幅も(書かなければ ±20%)
#   "X:名前(端子の役割 ...)" : サブ回路(端子は回路図のシンボルの端子の役割=pinfunction の順)
# 自分の部品は、データシートで確かめてから足す(例は下のコメント)。

[map]
"1N5231B"     = "1N5231B"
"2SC1815"     = "2SC1815"
# 例: ポリスイッチ(PTC)を抵抗で近似する      "PTC-例"     = "R:6.0±20%"
# 例: ガラス管ヒューズ 2A の冷間抵抗で近似する "FUSE-2A-例" = "R:0.05±50%"
# 例: DCDC モジュールをサブ回路で              "DCDC-5V-例" = "X:DCDC5(IN GND OUT)"
